name: aqueduct-pdm

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: aqueduct-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # BOUND TO LOOPBACK, NOT TO EVERY INTERFACE. Without the 127.0.0.1 prefix Docker
    # publishes this on 0.0.0.0, which on the deployment box means the database is
    # reachable from the public internet — and Docker writes its own iptables rules, so
    # a host firewall that looks correct does not stop it. Nothing outside this machine
    # has any business reaching Postgres directly: the API and the reveal service talk
    # to it over the compose network, and nginx is the only thing the internet touches.
    #
    # The server had this fix applied by hand and the repository did not, so a rebuild
    # from a clean clone would have quietly exposed the database. That drift is what
    # this line closes.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    # Docker defaults /dev/shm to 64 MB. PostgreSQL puts the shared memory for
    # parallel query workers there, and an aggregate over the measurements
    # hypertable needs far more than that -- with the default it fails outright
    # with "could not resize shared memory segment ... No space left on device".
    shm_size: 1gb

volumes:
  timescale_data:
